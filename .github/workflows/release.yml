name: Release package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Trillianti/menueqr-widget'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify source and release version
        run: node scripts/release.mjs verify
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm install --no-save --package-lock=false next@16.4.3
      - run: npm run test:next
      - run: node scripts/release.mjs pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release
          path: release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release
          path: release/
      # No dependency installs or package hooks execute in the OIDC job.
      - name: Verify archive handoff
        run: node scripts/release.mjs inspect
      - name: Publish checked tarball to npm
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: npm
        run: node scripts/release.mjs publish
      - name: Attach the published archive to a GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE: ${{ steps.npm.outputs.archive }}
          CHANNEL: ${{ steps.npm.outputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release already exists; npm archive integrity was verified."
            exit 0
          fi
          flags=()
          if [[ "$CHANNEL" == next ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "$ARCHIVE" release/SHA256SUMS --verify-tag --title "MenüQR Widget $RELEASE_TAG" --notes-file release/NOTES.md "${flags[@]}"
